sdr:
  host: 127.0.0.1
  port: 1234
  fft-size: 2048
  sample-rate: 2400000
  center-frequency: 90900000    # 90.9000 MHz
  auto-gain: true
  gain-tenths-db: 0
  target-fps: 50
  waterfall-height: 320
  min-db: -100
  max-db: 0
  audio-enabled: false
  demod-mode: WFM        # WFM | NFM | AM | CW
  volume: 0.6
  cw-pitch: 700          # CW sidetone / BFO pitch (Hz)
  cw-bandwidth: 300      # CW filter bandwidth (Hz)
  scan-start-frequency: 24000000     # 24 MHz
  scan-stop-frequency: 1766000000    # 1766 MHz
  scan-step-hz: 200000                # 200 kHz retune step
  scan-threshold-db: 12.0             # peak-above-noise-floor to call a "hit" (dB)
  scan-settle-ms: 150                 # tuner/spectrum settle time before measuring (ms)
  scan-linger-ms: 2000                # dwell time on a detected signal (ms)
  scan-loop: true                     # wrap around at the end of the range

spring:
  main:
    banner-mode: "off"

logging:
  level:
    root: WARN
